name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  macos:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          # project.yml targets xcodeVersion 16 / objectVersion 77.
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer \
            || sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer \
            || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer \
            || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer \
            || sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -scheme Nexus \
            -configuration Debug \
            -destination 'platform=macOS' \
            build

      - name: Test
        run: |
          # MemoryStress creates 1000-note vaults and thrash-kills subsequent
          # SyncE2E git pushes on the shared runner; run it separately locally.
          xcodebuild \
            -scheme Nexus \
            -configuration Debug \
            -destination 'platform=macOS' \
            -skip-testing:NexusTests/MemoryStressTests \
            test
