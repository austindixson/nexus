<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Nexus feature map</title>
  <desc id="desc">Hub-and-spoke map of vaults, notes, graph, search, canvas, workspace, and plugins.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1020"/>
      <stop offset="100%" stop-color="#1a1440"/>
    </linearGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </radialGradient>
    <style>
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #f4f6ff; }
      .sub { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #9aa3c7; }
      .hub { font: 800 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0b1020; }
      .f { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #eef1ff; }
      .d { font: 500 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #a8b0d0; }
      .edge { stroke: #4f5d9a; stroke-width: 1.5; fill: none; opacity: 0.85; }
      .card { fill: #171b2e; stroke: #2f3a66; stroke-width: 1.4; rx: 12; }
    </style>
  </defs>
  <rect width="960" height="480" fill="url(#bg)" rx="20"/>
  <text x="40" y="40" class="title">Feature map — one app, local knowledge graph</text>
  <text x="40" y="62" class="sub">Everything orbits plain Markdown on disk. The graph is the product; the rest is fast navigation.</text>

  <!-- edges from hub -->
  <line class="edge" x1="480" y1="250" x2="160" y2="150"/>
  <line class="edge" x1="480" y1="250" x2="360" y2="120"/>
  <line class="edge" x1="480" y1="250" x2="600" y2="120"/>
  <line class="edge" x1="480" y1="250" x2="800" y2="150"/>
  <line class="edge" x1="480" y1="250" x2="160" y2="360"/>
  <line class="edge" x1="480" y1="250" x2="360" y2="400"/>
  <line class="edge" x1="480" y1="250" x2="600" y2="400"/>
  <line class="edge" x1="480" y1="250" x2="800" y2="360"/>

  <!-- hub -->
  <circle cx="480" cy="250" r="52" fill="url(#hub)" opacity="0.95"/>
  <text x="480" y="256" text-anchor="middle" class="hub">Nexus</text>

  <!-- feature cards -->
  <g transform="translate(70,100)">
    <rect width="180" height="70" class="card"/>
    <text x="16" y="28" class="f">Vaults</text>
    <text x="16" y="48" class="d">Any folder · FSEvents</text>
  </g>
  <g transform="translate(270,70)">
    <rect width="180" height="70" class="card"/>
    <text x="16" y="28" class="f">Notes</text>
    <text x="16" y="48" class="d">[[links]] · KaTeX · GFM</text>
  </g>
  <g transform="translate(510,70)">
    <rect width="180" height="70" class="card"/>
    <text x="16" y="28" class="f">Graph</text>
    <text x="16" y="48" class="d">Global / local · Metal</text>
  </g>
  <g transform="translate(710,100)">
    <rect width="180" height="70" class="card"/>
    <text x="16" y="28" class="f">Search</text>
    <text x="16" y="48" class="d">path: tag: file:</text>
  </g>
  <g transform="translate(70,320)">
    <rect width="180" height="70" class="card"/>
    <text x="16" y="28" class="f">Canvas</text>
    <text x="16" y="48" class="d">Cards · groups · arrows</text>
  </g>
  <g transform="translate(270,360)">
    <rect width="180" height="70" class="card"/>
    <text x="16" y="28" class="f">Workspace</text>
    <text x="16" y="48" class="d">Layout per vault</text>
  </g>
  <g transform="translate(510,360)">
    <rect width="180" height="70" class="card"/>
    <text x="16" y="28" class="f">Command palette</text>
    <text x="16" y="48" class="d">⌘P · quick switcher</text>
  </g>
  <g transform="translate(710,320)">
    <rect width="180" height="70" class="card"/>
    <text x="16" y="28" class="f">Plugins</text>
    <text x="16" y="48" class="d">Swift hooks · MIT</text>
  </g>
</svg>
