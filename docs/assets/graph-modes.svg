<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Global vs local graph</title>
  <desc id="desc">Comparison of global vault graph and local neighborhood graph with depth control.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1220"/>
      <stop offset="100%" stop-color="#151a30"/>
    </linearGradient>
    <style>
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #f4f6ff; }
      .sub { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #9aa3c7; }
      .h { font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #eef1ff; }
      .p { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #a8b0d0; }
      .panel { fill: #171b2e; stroke: #2f3a66; stroke-width: 1.5; rx: 16; }
      .e { stroke: #5eead4; stroke-width: 1.4; opacity: 0.7; }
      .e2 { stroke: #a78bfa; stroke-width: 1.4; opacity: 0.75; }
    </style>
  </defs>
  <rect width="960" height="340" fill="url(#bg)" rx="20"/>
  <text x="40" y="40" class="title">Graph modes</text>
  <text x="40" y="62" class="sub">⌘⌥G global · ⌘⌥⇧G local (depth 1–5) · filters for orphans, tags, unresolved links</text>

  <!-- Global panel -->
  <rect x="40" y="90" width="430" height="220" class="panel"/>
  <text x="60" y="120" class="h">Global graph</text>
  <text x="60" y="142" class="p">Entire vault as a force-directed map</text>
  <!-- mini graph -->
  <g transform="translate(90,160)">
    <line class="e" x1="80" y1="60" x2="160" y2="30"/>
    <line class="e" x1="80" y1="60" x2="40" y2="100"/>
    <line class="e" x1="80" y1="60" x2="200" y2="90"/>
    <line class="e" x1="160" y1="30" x2="220" y2="50"/>
    <line class="e" x1="40" y1="100" x2="100" y2="130"/>
    <line class="e" x1="200" y1="90" x2="100" y2="130"/>
    <line class="e" x1="160" y1="30" x2="100" y2="130"/>
    <circle cx="80" cy="60" r="10" fill="#67e8f9"/>
    <circle cx="160" cy="30" r="7" fill="#a78bfa"/>
    <circle cx="40" cy="100" r="7" fill="#818cf8"/>
    <circle cx="200" cy="90" r="8" fill="#22d3ee"/>
    <circle cx="220" cy="50" r="6" fill="#c4b5fd"/>
    <circle cx="100" cy="130" r="8" fill="#38bdf8"/>
  </g>
  <text x="60" y="290" class="p">Best for orientation, clusters, orphans</text>

  <!-- Local panel -->
  <rect x="490" y="90" width="430" height="220" class="panel"/>
  <text x="510" y="120" class="h">Local graph</text>
  <text x="510" y="142" class="p">Neighborhood of the active note</text>
  <g transform="translate(560,160)">
    <line class="e2" x1="120" y1="70" x2="40" y2="40"/>
    <line class="e2" x1="120" y1="70" x2="50" y2="120"/>
    <line class="e2" x1="120" y1="70" x2="200" y2="40"/>
    <line class="e2" x1="120" y1="70" x2="210" y2="120"/>
    <line class="e2" x1="120" y1="70" x2="120" y2="20"/>
    <circle cx="120" cy="70" r="14" fill="#f0abfc"/>
    <circle cx="40" cy="40" r="7" fill="#67e8f9"/>
    <circle cx="50" cy="120" r="7" fill="#22d3ee"/>
    <circle cx="200" cy="40" r="7" fill="#a5b4fc"/>
    <circle cx="210" cy="120" r="7" fill="#818cf8"/>
    <circle cx="120" cy="20" r="6" fill="#5eead4"/>
  </g>
  <text x="510" y="290" class="p">Best while writing · depth 1–5</text>
</svg>
