<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">How the graph stays in sync</title>
  <desc id="desc">Pipeline from vault edit through FSEvents, rescan, LinkIndex rebuild, to graph physics and render.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1220"/>
      <stop offset="100%" stop-color="#14182c"/>
    </linearGradient>
    <linearGradient id="n1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <style>
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #f4f6ff; }
      .sub { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #9aa3c7; }
      .step { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #eef1ff; }
      .detail { font: 500 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #a8b0d0; }
      .num { font: 800 12px ui-monospace, Menlo, monospace; fill: #0b1020; }
      .line { stroke: #3d4a7a; stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect width="960" height="360" fill="url(#bg)" rx="20"/>
  <text x="40" y="40" class="title">How the graph stays in sync</text>
  <text x="40" y="62" class="sub">Every external edit reindexes — the graph is a live view of your vault, not a separate database.</text>

  <!-- connecting line -->
  <path class="line" d="M110 190 H850"/>

  <!-- steps -->
  <g transform="translate(50,120)">
    <circle cx="60" cy="70" r="36" fill="url(#n1)"/>
    <text x="60" y="75" text-anchor="middle" class="num">1</text>
    <text x="60" y="130" text-anchor="middle" class="step">Edit on disk</text>
    <text x="60" y="150" text-anchor="middle" class="detail">.md change</text>
    <text x="60" y="166" text-anchor="middle" class="detail">any editor</text>
  </g>

  <g transform="translate(220,120)">
    <circle cx="60" cy="70" r="36" fill="url(#n1)"/>
    <text x="60" y="75" text-anchor="middle" class="num">2</text>
    <text x="60" y="130" text-anchor="middle" class="step">FSEvents</text>
    <text x="60" y="150" text-anchor="middle" class="detail">debounced</text>
    <text x="60" y="166" text-anchor="middle" class="detail">vault watch</text>
  </g>

  <g transform="translate(390,120)">
    <circle cx="60" cy="70" r="36" fill="url(#n1)"/>
    <text x="60" y="75" text-anchor="middle" class="num">3</text>
    <text x="60" y="130" text-anchor="middle" class="step">Rescan</text>
    <text x="60" y="150" text-anchor="middle" class="detail">notes map</text>
    <text x="60" y="166" text-anchor="middle" class="detail">file tree</text>
  </g>

  <g transform="translate(560,120)">
    <circle cx="60" cy="70" r="36" fill="url(#n1)"/>
    <text x="60" y="75" text-anchor="middle" class="num">4</text>
    <text x="60" y="130" text-anchor="middle" class="step">LinkIndex</text>
    <text x="60" y="150" text-anchor="middle" class="detail">wikilinks</text>
    <text x="60" y="166" text-anchor="middle" class="detail">tags · graph</text>
  </g>

  <g transform="translate(730,120)">
    <circle cx="60" cy="70" r="36" fill="url(#n1)"/>
    <text x="60" y="75" text-anchor="middle" class="num">5</text>
    <text x="60" y="130" text-anchor="middle" class="step">Render</text>
    <text x="60" y="150" text-anchor="middle" class="detail">force layout</text>
    <text x="60" y="166" text-anchor="middle" class="detail">Metal / CG</text>
  </g>
</svg>
