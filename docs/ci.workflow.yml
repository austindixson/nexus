name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -scheme Nexus \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            build

      - name: Test
        run: |
          xcodebuild \
            -scheme Nexus \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            test
